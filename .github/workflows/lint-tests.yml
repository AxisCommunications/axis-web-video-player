name: lint-tests

on:
  pull_request:
    paths:
      - .github/workflows/lint-tests.yml
      - src/**
      - example/**
      - package.json
      - package-lock.json
  push:
    paths:
      - .github/workflows/lint-tests.yml
      - src/**
      - example/**
      - package.json
      - package-lock.json
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
      - run: |
          npm ci
          cd example && npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Lint and Format"
        run: npm run lint-ci
