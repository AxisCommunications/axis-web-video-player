<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link ref="stylesheet" href="/src/style.css" />
    <title>Axis Web Video Player example</title>
  </head>

  <body>
    <div class="container">
      <div id="login-screen" class="login-screen" style="display: none">
        <button id="login-button">Login</button>
      </div>
      <div id="video-container" class="video-container" style="display: none">
        <div id="video" class="video"></div>
        <div id="playback-controls" style="display: none" >
          <input type="range" id="progress-bar" class="progress-bar" disabled />
          <button id="play-pause-button" disabled>Play</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
